
name: Deploy KNOWTIX to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: knowtix-dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: knowtix-dashboard/frontend
        run: npm ci

      - name: Build KNOWTIX application
        working-directory: knowtix-dashboard/frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -f knowtix-dashboard/frontend/dist/index.html
          echo "KNOWTIX dashboard build verified"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: knowtix-dashboard/frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
